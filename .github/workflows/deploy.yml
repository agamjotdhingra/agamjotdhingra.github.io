name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages to call the GitHub Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false   # Do NOT cancel in-progress runs — let the deploy finish.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Verify that Vite produced the compiled bundle, not the dev-server source file.
      # This step prints dist/index.html in the Actions log and fails hard if the build
      # produced the wrong output — making future regressions immediately visible.
      - name: Verify dist/index.html references compiled assets
        run: |
          echo "=== dist/index.html ==="
          cat dist/index.html
          echo ""
          echo "=== dist/ listing ==="
          ls -la dist/
          echo "=== dist/assets/ ==="
          ls -la dist/assets/

          if grep -q "src/main.tsx" dist/index.html; then
            echo "FATAL: dist/index.html still references /src/main.tsx"
            exit 1
          fi

          if ! grep -q "/assets/" dist/index.html; then
            echo "FATAL: dist/index.html has no /assets/ references — Vite build did not run."
            exit 1
          fi

          echo "✓ dist/index.html correctly references compiled /assets/ files."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
